<!DOCTYPE html>
<html>
<head>
    <title>Price Tracker</title>
    <link rel="stylesheet" href="/static/Tracker/style.css">
</head>
<body>
    <h1>Tracked Products</h1>

    <form id="add-product-form">
        <input type="text" id="name" placeholder="Product name" required>
        <input type="url" id="url" placeholder="Product URL" required>
        <input type="text" id="store" placeholder="Store (e.g. Flipkart)" required>
        <input type="number" id="target_price" placeholder="Target price (optional)">
        <button type="submit">Add Product</button>
    </form>

    <table id="product-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Store</th>
                <th>Active</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="product-table-body"></tbody>
    </table>

    <script src="/static/Tracker/main.js"></script>
</body>
</html>
